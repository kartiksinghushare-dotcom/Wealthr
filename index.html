<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Wealthr</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}html.auth-open{overflow-y:auto}body{height:100%;font-family:'DM Sans',sans-serif;overflow:hidden;background:var(--bg);color:var(--tx);transition:background .3s,color .3s}
body.auth-open{overflow-y:auto}
:root{
  --bg:#0F1117;--sf:#181B24;--el:#1E2130;--bds:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);
  --ac:#10D9A8;--acd:rgba(16,217,168,.12);--acg:linear-gradient(135deg,#10D9A8,#0EBBCE);
  --tx:#F0F2F8;--t2:#8B8FA8;--t3:#454860;
  --rd:#FF5A72;--rdd:rgba(255,90,114,.12);
  --am:#FFB547;--amd:rgba(255,181,71,.12);
  --bl:#5B9EFF;--bld:rgba(91,158,255,.12);
  --pur:#A78BFA;--purd:rgba(167,139,250,.12);
  --r8:8px;--r12:12px;--r16:16px;--r20:20px;
}
.light{
  --bg:#F2F4FA;--sf:#FFFFFF;--el:#EEF0F8;--bds:rgba(0,0,0,.06);--bd:rgba(0,0,0,.11);
  --ac:#00A882;--acd:rgba(0,168,130,.1);--acg:linear-gradient(135deg,#00A882,#0097B2);
  --tx:#0D1020;--t2:#5A5E78;--t3:#9FA3BA;
  --rd:#E03050;--rdd:rgba(224,48,80,.1);
  --am:#C47B00;--amd:rgba(196,123,0,.1);
  --bl:#2070D8;--bld:rgba(32,112,216,.1);
  --pur:#7C5CCA;--purd:rgba(124,92,202,.1);
}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px}
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--sf);border-right:1px solid var(--bds);display:flex;flex-direction:column;overflow-y:auto;transition:background .3s}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.pe{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.pe.animate{animation:pe .18s ease}
@keyframes pe{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.page-head{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
.page-body{flex:1;overflow-y:auto;padding:18px 24px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.slogo{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bds)}
.slogo-icon{width:30px;height:30px;background:var(--acg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slogo-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--tx)}
.slogo-sub{font-size:10px;color:var(--t3)}
.snav{flex:1;padding:8px 8px 0}
.snav-sec{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;padding:12px 8px 5px}
.snav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r12);cursor:pointer;color:var(--t2);font-size:13px;font-weight:500;transition:all .13s;margin-bottom:1px;border:none;background:none;width:100%;text-align:left;font-family:inherit;touch-action:manipulation}
.snav-item:hover{background:var(--el);color:var(--tx)}
.snav-item.active{background:var(--acd);color:var(--ac)}
.ni-ico{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--el)}
.snav-item.active .ni-ico{background:var(--acd)}
.nav-badge{margin-left:auto;background:var(--rd);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:99px}
.sbar-foot{padding:10px;border-top:1px solid var(--bds)}
.user-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r12);background:var(--el)}
.user-av{width:28px;height:28px;border-radius:50%;background:var(--acg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0}
.ph-title{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--tx)}
.ph-sub{font-size:12px;color:var(--t2);margin-top:2px}
.ph-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r12);border:1px solid var(--bd);background:var(--el);color:var(--tx);font-size:13px;font-weight:500;cursor:pointer;transition:all .13s;font-family:inherit;line-height:1.3;white-space:nowrap;touch-action:manipulation}
.btn:hover{background:var(--bd)}
.btn-primary{background:var(--ac);border-color:var(--ac);color:#000!important;font-weight:600}
.btn-primary:hover{opacity:.88}
.btn-ghost{border-color:transparent;background:transparent;color:var(--t2)}
.btn-ghost:hover{background:var(--el);color:var(--tx)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:var(--r8)}
.btn-icon{padding:6px;width:36px;height:36px;min-width:36px;justify-content:center;border-radius:var(--r8)}
.btn-danger{background:var(--rdd);border-color:transparent;color:var(--rd)}
.btn-danger:hover{background:var(--rd);color:#fff}
.card{background:var(--sf);border:1px solid var(--bds);border-radius:var(--r16);padding:16px;transition:all .2s}
.mono{font-family:'JetBrains Mono',monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600}
.badge-g{background:var(--acd);color:var(--ac)}.badge-r{background:var(--rdd);color:var(--rd)}.badge-a{background:var(--amd);color:var(--am)}.badge-b{background:var(--bld);color:var(--bl)}.badge-p{background:var(--purd);color:var(--pur)}.badge-m{background:var(--el);color:var(--t2)}
.pbar{width:100%;height:5px;background:var(--el);border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width .5s}
input,select,textarea{background:var(--el);border:1.5px solid var(--bds);border-radius:var(--r12);color:var(--tx);font-family:inherit;font-size:16px;padding:9px 11px;width:100%;outline:none;transition:all .13s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac);background:var(--sf)}
input::placeholder,textarea::placeholder{color:var(--t3)}
select option{background:var(--sf)}
.fg{margin-bottom:11px}
.fl{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:5px;display:block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r20);padding:22px;width:100%;max-width:450px;max-height:85vh;overflow-y:auto;animation:su .18s;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mt{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--tx)}
.mf{display:flex;gap:7px;margin-top:18px;justify-content:flex-end}
@keyframes su{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bds);z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
.bni{display:flex;justify-content:space-around;padding:7px 0 4px}
.bna{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;cursor:pointer;color:var(--t3);font-size:10px;font-weight:500;min-width:50px;border:none;background:none;font-family:inherit;position:relative;touch-action:manipulation}
.bna.active{color:var(--ac)}
.ins-card{border-radius:var(--r12);padding:11px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px}
.ins-ok{background:var(--acd);color:var(--ac)}.ins-warn{background:var(--amd);color:var(--am)}.ins-danger{background:var(--rdd);color:var(--rd)}.ins-info{background:var(--bld);color:var(--bl)}
.ins-t{font-size:12px;font-weight:600;margin-bottom:2px}.ins-b{font-size:11px;opacity:.8;line-height:1.4}
.acc-card{background:var(--sf);border:1px solid var(--bds);border-radius:var(--r16);padding:15px;transition:all .2s}
.acc-card:hover{border-color:var(--bd);transform:translateY(-1px)}
.cc-card{background:var(--sf);border:1px solid var(--bds);border-radius:var(--r16);padding:16px;transition:all .2s}
.cc-card:hover{border-color:var(--bd)}
.item-row{background:var(--sf);border:1px solid var(--bds);border-radius:var(--r12);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:7px;transition:border-color .13s}
.item-row:hover{border-color:var(--bd)}
.icon-pill{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inv-row{background:var(--sf);border:1px solid var(--bds);border-radius:var(--r12);padding:14px;margin-bottom:9px}
.inv-row:hover{border-color:var(--bd)}
.ti{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:var(--r12);transition:background .12s}
.ti:hover{background:var(--el)}
.tchk{width:24px;height:24px;border-radius:6px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;background:none;transition:all .13s;touch-action:manipulation}
.tchk.done{background:var(--ac);border-color:var(--ac)}
.tog{width:34px;height:19px;border-radius:99px;background:var(--el);border:1.5px solid var(--bd);cursor:pointer;position:relative;transition:all .3s;flex-shrink:0;display:inline-block;touch-action:manipulation}
.tog-dot{width:12px;height:12px;border-radius:50%;background:var(--t2);position:absolute;top:2px;left:2px;transition:all .3s;pointer-events:none}
.tog.on{background:var(--acd);border-color:var(--ac)}.tog.on .tog-dot{left:18px;background:var(--ac)}
.cwrap{position:relative;height:180px;width:100%}
.pill-tabs{display:flex;background:var(--el);border-radius:var(--r12);padding:3px;gap:2px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.pill-tabs::-webkit-scrollbar{display:none}
.pill-tab{flex-shrink:0;padding:6px 10px;border-radius:9px;border:none;background:none;color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .13s;white-space:nowrap;touch-action:manipulation}
.pill-tab.active{background:var(--sf);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.nw-hero{background:var(--acg);border-radius:var(--r20);padding:20px;margin-bottom:13px;position:relative;overflow:hidden}
.nw-hero::after{content:'';position:absolute;top:-24px;right:-24px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.nw-hero-lbl{font-size:11px;font-weight:600;color:rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.nw-hero-val{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:#000;line-height:1;margin-bottom:8px}
.nw-pills{display:flex;gap:7px;flex-wrap:wrap}
.nw-pill{background:rgba(0,0,0,.12);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:600;color:#000}
.stat-box{background:var(--el);border-radius:var(--r12);padding:12px 13px}
.stat-box-lbl{font-size:11px;color:var(--t2);margin-bottom:3px}
.stat-box-val{font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--tx)}
.stat-box-val.green{color:var(--ac)}.stat-box-val.red{color:var(--rd)}
.empty{text-align:center;padding:44px 20px}
.empty-ico{font-size:34px;margin-bottom:9px}
.empty-title{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:5px}
.empty-sub{font-size:12px;color:var(--t2);line-height:1.5}

/* ── CALENDAR ── */
.cal-wrap{display:grid;grid-template-columns:1fr 280px;gap:14px;min-height:500px}
.cal-grid-side{display:flex;flex-direction:column;min-height:0}
.cal-detail{background:var(--sf);border:1px solid var(--bds);border-radius:var(--r16);padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.cday{border-radius:7px;padding:5px 6px;min-height:58px;background:var(--el);border:1.5px solid transparent;cursor:pointer;transition:all .13s;touch-action:manipulation}
.cday:hover{border-color:var(--bd);background:var(--sf)}
.cday.today{border-color:var(--ac)}
.cday.selected{border-color:var(--ac);background:var(--acd)}

.cdot{width:5px;height:5px;border-radius:50%;display:inline-block;margin:1px}
.cal-event-row{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border-radius:var(--r12);background:var(--el);font-size:12px}
.cal-ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:2px}
.cal-filter-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.cal-filter-btn{padding:4px 10px;border-radius:99px;border:1.5px solid var(--bd);background:none;color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .13s;touch-action:manipulation}
.cal-filter-btn.active{background:var(--ac);border-color:var(--ac);color:#000}

/* Legacy compat */
.nec-toggle{display:flex;gap:0;border-radius:var(--r12);overflow:hidden;border:1.5px solid var(--bds)}
.nec-btn{flex:1;padding:8px 4px;border:none;background:var(--el);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;touch-action:manipulation}
.nec-btn.active-need{background:#10D9A820;color:var(--ac)}
.nec-btn.active-want{background:var(--amd);color:var(--am)}
.nec-btn.active-avoid{background:var(--rdd);color:var(--rd)}
.cat-swatch{width:28px;height:28px;border-radius:8px;flex-shrink:0;cursor:pointer;border:2.5px solid transparent;transition:border-color .13s;touch-action:manipulation}
.cat-swatch.sel{border-color:var(--tx)}
.cat-color-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}




/* ── Bottom Sheet ── */
.bsheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1100;opacity:0;transition:opacity .25s;pointer-events:none;visibility:hidden}
.bsheet-overlay.open{opacity:1;pointer-events:auto;visibility:visible}
.bsheet{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-radius:20px 20px 0 0;z-index:1101;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom,16px);max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bsheet.open{transform:translateY(0)}
.bsheet-handle{width:36px;height:4px;border-radius:99px;background:var(--bd);margin:10px auto 4px}

.bsheet-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding:0 8px 12px}
.bsheet-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:var(--r12);cursor:pointer;border:none;background:none;font-family:inherit;touch-action:manipulation;transition:background .13s}
.bsheet-item:active{background:var(--el)}
.bsheet-item.active{background:var(--acd)}
.bsheet-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--el);transition:background .13s}
.bsheet-item.active .bsheet-ico{background:var(--acd)}
.bsheet-lbl{font-size:11px;font-weight:500;color:var(--t2)}
.bsheet-item.active .bsheet-lbl{color:var(--ac)}

@media(max-width:768px){
  .sidebar{display:none}.bnav{display:block}
  .page-body{padding:12px 12px calc(80px + env(safe-area-inset-bottom,0px))}.page-head{padding:14px 12px 0}
  .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
  .ph-title{font-size:18px}.frow{grid-template-columns:1fr}
  .nw-hero-val{font-size:24px}
  .cal-wrap{grid-template-columns:1fr}
  .cal-detail{display:none}
  .cal-detail.show{display:flex}
  .page-head{flex-wrap:wrap;gap:8px}

}
</style>
<!-- Firebase SDK (compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
<!-- Auth screen — shown before sign-in -->
<div id="auth-screen" style="display:flex;position:fixed;inset:0;z-index:9999;background:var(--bg);align-items:center;justify-content:center;padding:20px;overflow-y:auto">

  <!-- Background grid pattern -->
  <div style="position:fixed;inset:0;background-image:linear-gradient(var(--bds) 1px,transparent 1px),linear-gradient(90deg,var(--bds) 1px,transparent 1px);background-size:44px 44px;pointer-events:none"></div>

  <!-- Glow -->
  <div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(16,217,168,.07) 0%,transparent 70%);pointer-events:none"></div>

  <!-- Card -->
  <div style="position:relative;width:100%;max-width:400px;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.35)">

    <!-- Logo -->
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:32px">
      <div style="width:38px;height:38px;background:linear-gradient(135deg,#10D9A8,#0EBBCE);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V8H5A2 2 0 0 1 5 4H19V8"/><path d="M3 6V18A2 2 0 0 0 5 20H21V16"/><path d="M18 14A1 1 0 1 0 18 12"/></svg>
      </div>
      <span style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--tx);letter-spacing:-.5px">Wealthr</span>
    </div>

    <!-- Mode heading + switcher -->
    <div style="margin-bottom:24px">
      <div id="auth-heading" style="font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:var(--tx);margin-bottom:4px">Welcome back</div>
      <div style="font-size:13px;color:var(--t2)">
        <span id="auth-switch-text">Don't have an account?</span>
        <button id="auth-switch-btn" onclick="switchMode()" style="border:none;background:none;color:var(--ac);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;margin-left:4px;padding:0;touch-action:manipulation">Sign Up</button>
      </div>
    </div>

    <!-- Google button -->

function migrateData(d){
  if(!d.settings)d.settings={};
  if(!d.settings.currency)d.settings.currency='AED';
  if(!d.settings.rates)d.settings.rates={INR:0.044,USD:3.67,EUR:3.99,GBP:4.65,SAR:0.98};
  if(!d.settings.categories)d.settings.categories=[];
  // Ensure all array keys exist
  ['accounts','cards','expenses','income','investments','tasks'].forEach(function(k){
    if(!Array.isArray(d[k]))d[k]=[];
  });
  var base=d.settings.currency;
  ['accounts','cards','expenses','income','investments'].forEach(function(k){
    d[k].forEach(function(item){if(!item.currency)item.currency=base;});
  });
  d.expenses.forEach(function(e){if(!e.necessity)e.necessity='need';});
  return d;
}

function saveData(){
  if(!_userId){return;} // not signed in yet
  var db=firebase.firestore();
  db.collection('users').doc(_userId).set(app.data)
    .catch(function(err){toast('Save failed: '+err.message,'error');});
}

function loadData(callback){
  if(!_userId){callback(JSON.parse(JSON.stringify(SAMPLE)));return;}
  var db=firebase.firestore();
  db.collection('users').doc(_userId).get()

      if(doc.exists){
        callback(migrateData(doc.data()));

        callback(fresh);

}

function toBase(amount,itemCurrency){
  var base=app.data.settings.currency||'AED';
  if(!itemCurrency||itemCurrency===base)return +amount||0;
  var rate=(app.data.settings.rates||{})[itemCurrency];
  return rate?(+amount||0)*rate:(+amount||0);
}

}

// ── CALCULATIONS ───────────────────────────────────────────────
function totals(){
  var d=app.data;
  var bank=d.accounts.reduce(function(s,a){return s+toBase(+a.balance||0,a.currency);},0);
  var inv=d.investments.reduce(function(s,i){return s+toBase(+i.current||0,i.currency);},0);
  var co=d.cards.reduce(function(s,c){return s+toBase(+c.outstanding||0,c.currency);},0);
  var cl=d.cards.reduce(function(s,c){return s+toBase(+c.limit||0,c.currency);},0);
  var me=d.expenses.reduce(function(s,e){
    var a=toBase(+e.amount||0,e.currency);
    return s+(e.type==='daily'?a*30:e.type==='weekly'?a*4.33:e.type==='once'?0:a);
  },0);
  var mi=d.income.filter(function(i){return i.recurring;}).reduce(function(s,i){
    var a=toBase(+i.amount||0,i.currency);
    return s+(i.freq==='weekly'?a*4.33:a);
  },0);
  return{bank:bank,inv:inv,co:co,cl:cl,nw:bank+inv-co,up:cl>0?(co/cl)*100:0,me:me,mi:mi,daily:me/30};
}

function calcForecast(target){
  var now=new Date(),tgt=new Date(target+'T12:00:00');
  if(!target||tgt<=now)return null;
  var dl=Math.ceil((tgt-now)/86400000),days=dpm(now);
  var bal=app.data.accounts.reduce(function(s,a){return s+toBase(+a.balance||0,a.currency);},0);
  bal-=app.data.cards.reduce(function(s,c){return s+toBase(+c.outstanding||0,c.currency);},0);
  app.data.income.filter(function(i){return i.recurring;}).forEach(function(i){
    var a=toBase(+i.amount||0,i.currency);
    if(i.freq==='monthly')bal+=a*Math.ceil(dl/30);
    else if(i.freq==='weekly')bal+=a*Math.floor(dl/7);
  });
  app.data.expenses.forEach(function(e){
    var a=toBase(+e.amount||0,e.currency);
    if(e.type==='daily')bal-=a*dl;
    else if(e.type==='weekly')bal-=(a/7)*dl;
    else if(e.type==='monthly')bal-=a*Math.ceil(dl/30);
    else if(e.type==='once'&&e.date){var ed=new Date(e.date+'T12:00:00');if(!isNaN(ed)&&ed>=now&&ed<=tgt)bal-=a;}
  });
  return{balance:bal,days:dl};
}

function insights(){
  var r=[],d=app.data,t=totals(),cur=d.settings.currency||'AED';
  if(t.up>60)r.push({type:'danger',h:'High credit utilization',b:t.up.toFixed(0)+'% used — target under 30%.'});
  else if(t.up>30)r.push({type:'warn',h:'Credit utilization at '+t.up.toFixed(0)+'%',b:'Approaching the healthy 30% threshold.'});
  else if(t.up>0)r.push({type:'ok',h:'Credit utilization healthy',b:'Only '+t.up.toFixed(0)+'% — great job!'});
  if(t.mi>0){
    var sv=(t.mi-t.me)/t.mi*100;
    if(sv<10)r.push({type:'warn',h:'Low savings rate '+sv.toFixed(0)+'%',b:'Aim to save at least 20% of income.'});
    else if(sv>=20)r.push({type:'ok',h:'Strong savings rate '+sv.toFixed(0)+'%',b:'Building wealth effectively.'});
  }
  if(t.me>0){
    var rw=t.daily>0?t.bank/t.daily:999;
    if(rw<60)r.push({type:'danger',h:'Low runway — '+Math.round(rw)+' days',b:'Current bank balance covers only '+Math.round(rw)+' days of spending.'});
    else if(rw>=90)r.push({type:'ok',h:'Solid runway — '+Math.floor(rw/30)+' months',b:'Good emergency buffer at current burn rate.'});
  }
  d.cards.forEach(function(c){
    var dd=dueDays(c.due);
    if(dd<=3){var ccur=c.currency||cur;r.push({type:'warn',h:(c.nickname||c.bank)+' due '+(dd===0?'today':dd+'d'),b:'Min: '+fmtf(toBase(+c.minDue||0,ccur),cur)+(ccur!==cur?' ('+fmtf(+c.minDue||0,ccur)+')':'')});}
  });
  if(!r.length)r.push({type:'info',h:'Add your financial data',b:'Add accounts, income, and expenses to see personalized insights.'});
  return r;
}

function buildCalendarEvents(mo,yr){

  function addEv(day,ev_){
    if(day<1)return;

    ev[day].push(ev_);
  }

  // Monthly income — shown on day 1
  d.income.filter(function(i){return i.recurring&&i.freq==='monthly';}).forEach(function(i){
    addEv(1,{type:'income',label:esc(i.source),amount:toBase(+i.amount||0,i.currency),currency:cur,color:'var(--ac)'});
  });

  // Weekly income — shown every Monday (day that falls on Monday in this month)
  d.income.filter(function(i){return i.recurring&&i.freq==='weekly';}).forEach(function(i){
    for(var dd=1;dd<=new Date(yr,mo+1,0).getDate();dd++){
      if(new Date(yr,mo,dd).getDay()===1){
        addEv(dd,{type:'income',label:esc(i.source)+' (weekly)',amount:toBase(+i.amount||0,i.currency),currency:cur,color:'var(--ac)'});
      }
    }
  });

  // Credit card due dates
  d.cards.forEach(function(c){
    var dd=parseInt(c.due)||1;
    var ccur=c.currency||cur;
    addEv(dd,{type:'card',label:esc(c.nickname||c.bank)+' payment due',amount:toBase(+c.minDue||0,ccur),currency:cur,color:'var(--rd)'});
  });

  // Monthly expenses — shown on day 1
  d.expenses.filter(function(e){return e.type==='monthly';}).forEach(function(e){
    var ecur=e.currency||cur;
    addEv(1,{type:'expense',label:esc(e.name),amount:toBase(+e.amount||0,ecur),currency:cur,color:'var(--am)'});
  });

  // Daily expenses — shown every day
  d.expenses.filter(function(e){return e.type==='daily';}).forEach(function(e){
    var ecur=e.currency||cur;
    var daysInMonth=new Date(yr,mo+1,0).getDate();
    for(var dd=1;dd<=daysInMonth;dd++){
      addEv(dd,{type:'expense',label:esc(e.name)+' (daily)',amount:toBase(+e.amount||0,ecur),currency:cur,color:'var(--am)'});
    }
  });

  // Weekly expenses — shown on Monday
  d.expenses.filter(function(e){return e.type==='weekly';}).forEach(function(e){
    var ecur=e.currency||cur;
    for(var dd=1;dd<=new Date(yr,mo+1,0).getDate();dd++){
      if(new Date(yr,mo,dd).getDay()===1){
        addEv(dd,{type:'expense',label:esc(e.name)+' (weekly)',amount:toBase(+e.amount||0,ecur),currency:cur,color:'var(--am)'});
      }
    }
  });

  // One-time expenses — shown on their date
  d.expenses.filter(function(e){return e.type==='once'&&e.date;}).forEach(function(e){
    try{
      var parts=e.date.split('-');
      var ey=parseInt(parts[0]),em=parseInt(parts[1])-1,ed=parseInt(parts[2]);
      if(em===mo&&ey===yr){
        var ecur=e.currency||cur;
        addEv(ed,{type:'expense',label:esc(e.name),amount:toBase(+e.amount||0,ecur),currency:cur,color:'var(--am)'});
      }
    }catch(ex){}
  });

  // Tasks with due dates
  d.tasks.filter(function(t){return t.due;}).forEach(function(t){
    try{
      var parts=t.due.split('-');
      var ty=parseInt(parts[0]),tm=parseInt(parts[1])-1,td=parseInt(parts[2]);
      if(tm===mo&&ty===yr){
        addEv(td,{type:'task',label:esc(t.title),amount:0,currency:cur,color:t.done?'var(--t3)':'var(--pur)',done:!!t.done});
      }
    }catch(ex){}
  });

  return ev;
}

// ── TOAST ──────────────────────────────────────────────────────
function toast(msg,type){
  var t=document.createElement('div');
  var bg=type==='error'?'var(--rd)':type==='warn'?'var(--am)':'var(--ac)';
  t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:'+bg+';color:#000;font-size:13px;font-weight:600;padding:9px 18px;border-radius:99px;z-index:9999;box-shadow:0 3px 14px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){
    t.style.opacity='0';t.style.transition='opacity .3s';
    setTimeout(function(){t.parentNode&&t.parentNode.removeChild(t);},300);
  },2200);
}

    if(+i.sip>0)h+='<span class="badge badge-p">SIP '+fmtf(+i.sip,icur)+'/mo</span>';
    h+=curBadge(icur)+'</div></div>';
    h+='<div class="mono" style="font-size:13px;font-weight:700;color:'+(g>=0?'var(--ac)':'var(--rd)')+'">'+(g>=0?'+':'')+gpp.toFixed(1)+'%</div>';

// ── CALENDAR (full interactive) ─────────────────────────────────
function renderCalendar(){
  var d=app.data,now=new Date();
  var mo=app.calMonth,yr=app.calYear;
  var first=new Date(yr,mo,1).getDay(),days=new Date(yr,mo+1,0).getDate();
  var ev=buildCalendarEvents(mo,yr);
  var cur=d.settings.currency||'AED';

  // Apply filter
  var filterTypes={'all':null,'income':'income','expense':'expense','card':'card','task':'task'};
  var activeType=filterTypes[app.calFil];

  // Get selected day events
  var selDay=app.calDay;
  var selEvts=selDay?(ev[selDay]||[]):[];

  var h='<div class="pe">';
  h+='<div class="page-head">';
  h+='<div><div class="ph-title">'+MNFULL[mo]+' '+yr+'</div><div class="ph-sub">Financial calendar</div></div>';
  h+='<div class="ph-right">';
  h+='<button class="btn btn-ghost btn-icon" data-action="cal-prev" title="Previous month"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>';
  h+='<button class="btn btn-ghost btn-icon" data-action="cal-next" title="Next month"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>';
  h+='</div></div>';

  h+='<div class="page-body">';
  // Filter bar
  h+='<div class="cal-filter-bar">';
  [{k:'all',l:'All Events'},{k:'income',l:'💚 Income'},{k:'expense',l:'🟡 Bills'},{k:'card',l:'❤️ Cards'},{k:'task',l:'🟣 Tasks'}].forEach(function(f){
    h+='<button class="cal-filter-btn'+(app.calFil===f.k?' active':'')+'" data-action="cal-filter" data-filter="'+f.k+'">'+f.l+'</button>';
  });
  h+='</div>';

  h+='<div class="cal-wrap">';
  // Left: grid
  h+='<div class="cal-grid-side">';
  // Day headers
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:5px">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(day){
    h+='<div style="text-align:center;font-size:10px;font-weight:700;color:var(--t3);padding:3px 0">'+day+'</div>';
  });
  h+='</div>';
  // Days grid
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1">';
  for(var i=0;i<first;i++)h+='<div></div>';
  for(var d2=1;d2<=days;d2++){
    var dayEvts=ev[d2]||[];
    var filteredEvts=activeType?dayEvts.filter(function(e){return e.type===activeType;}):dayEvts;
    var isToday=(d2===now.getDate()&&mo===now.getMonth()&&yr===now.getFullYear());
    var isSel=(d2===selDay);
    h+='<div class="cday'+(isToday?' today':'')+(isSel?' selected':'')+'" data-action="cal-day" data-day="'+d2+'">';
    h+='<div style="font-size:10px;font-weight:'+(isToday||isSel?'700':'400')+';color:'+(isToday?'var(--ac)':isSel?'var(--ac)':'var(--t2)')+';margin-bottom:2px">'+d2+'</div>';
    // Show up to 3 colored dots
    filteredEvts.slice(0,3).forEach(function(ev2){
      h+='<span class="cdot" style="background:'+ev2.color+'"></span>';
    });
    if(filteredEvts.length>3)h+='<span style="font-size:8px;color:var(--t3)">+'+( filteredEvts.length-3)+'</span>';
    h+='</div>';
  }
  h+='</div>';
  // Legend
  h+='<div style="display:flex;gap:14px;flex-wrap:wrap;padding-top:10px;margin-top:8px;border-top:1px solid var(--bds)">';
  [{l:'Income',c:'var(--ac)'},{l:'Card Due',c:'var(--rd)'},{l:'Expense',c:'var(--am)'},{l:'Task',c:'var(--pur)'}].forEach(function(x){
    h+='<div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)"><span style="width:7px;height:7px;border-radius:50%;background:'+x.c+';display:inline-block"></span>'+x.l+'</div>';
  });
  h+='</div>';
  h+='</div>'; // close cal-grid-side

  // Right: detail panel
  h+='<div class="cal-detail" id="cal-detail">';
  if(selDay){
    h+='<div style="font-size:14px;font-weight:700;color:var(--tx);margin-bottom:2px">'+MNFULL[mo]+' '+selDay+', '+yr+'</div>';
    var totalInDay=selEvts.reduce(function(s,e){return s+(e.amount||0);},0);
    if(selEvts.length){
      h+='<div style="font-size:11px;color:var(--t2);margin-bottom:12px">'+selEvts.length+' event'+(selEvts.length!==1?'s':'');
      if(totalInDay>0)h+=' · '+fmt(totalInDay,cur)+' total';
      h+='</div>';
      selEvts.forEach(function(ev2){
        h+='<div class="cal-event-row">';
        h+='<div class="cal-ev-dot" style="background:'+ev2.color+'"></div>';
        h+='<div style="flex:1;min-width:0">';
        h+='<div style="font-size:12px;font-weight:600;margin-bottom:1px">'+ev2.label;
        if(ev2.done!==undefined)h+=' '+(ev2.done?'<span class="badge badge-m" style="font-size:9px">Done</span>':'<span class="badge badge-p" style="font-size:9px">Pending</span>');
        h+='</div>';
        h+='<div style="font-size:10px;color:var(--t2)">'+ev2.type.charAt(0).toUpperCase()+ev2.type.slice(1)+'</div>';
        h+='</div>';
        if(ev2.amount>0)h+='<div class="mono" style="font-size:12px;font-weight:700;color:'+(ev2.type==='income'?'var(--ac)':ev2.type==='card'?'var(--rd)':'var(--tx)')+'">'+fmt(ev2.amount,cur)+'</div>';
        h+='</div>';
      });
    }else{
      h+='<div class="empty" style="padding:20px 0"><div class="empty-ico">📭</div><div class="empty-sub">No events for this day</div></div>';
    }
  }else{
    // Show month summary
    var monthTotal={income:0,expense:0,card:0};
    for(var dd=1;dd<=days;dd++){(ev[dd]||[]).forEach(function(e){if(e.type==='income')monthTotal.income+=e.amount;else if(e.type==='expense')monthTotal.expense+=e.amount;else if(e.type==='card')monthTotal.card+=e.amount;});}
    h+='<div style="font-size:13px;font-weight:700;margin-bottom:12px">'+MNFULL[mo]+' Summary</div>';
    h+='<div class="cal-event-row"><div class="cal-ev-dot" style="background:var(--ac)"></div><div style="flex:1;font-size:12px;color:var(--t2)">Income</div><div class="mono" style="font-size:12px;font-weight:700;color:var(--ac)">'+fmt(monthTotal.income,cur)+'</div></div>';
    h+='<div class="cal-event-row"><div class="cal-ev-dot" style="background:var(--am)"></div><div style="flex:1;font-size:12px;color:var(--t2)">Expenses</div><div class="mono" style="font-size:12px;font-weight:700;color:var(--am)">'+fmt(monthTotal.expense,cur)+'</div></div>';
    h+='<div class="cal-event-row"><div class="cal-ev-dot" style="background:var(--rd)"></div><div style="flex:1;font-size:12px;color:var(--t2)">Card Payments</div><div class="mono" style="font-size:12px;font-weight:700;color:var(--rd)">'+fmt(monthTotal.card,cur)+'</div></div>';
    h+='<div style="border-top:1px solid var(--bds);padding-top:9px;margin-top:2px">';
    h+='<div style="font-size:11px;color:var(--t2);margin-bottom:5px">← Click any day to see events</div>';
    var allEvCount=Object.values(ev).reduce(function(s,a){return s+a.length;},0);
    h+='<div style="font-size:11px;color:var(--t3)">'+allEvCount+' total events this month</div>';
    h+='</div>';
  }
  h+='</div>'; // close cal-detail

  h+='</div>'; // close cal-wrap
  h+='</div>'; // close page-body
  h+='</div>'; // close pe
  return h;
}

// ── REPORTS ────────────────────────────────────────────────────
function renderReports(){
  var d=app.data,cur=d.settings.currency||'AED',t=totals();
  var sv=t.mi>0?(t.mi-t.me)/t.mi*100:0;
  var h='<div class="pe"><div class="page-head"><div><div class="ph-title">Reports</div><div class="ph-sub">Financial summary</div></div></div>';
  h+='<div class="page-body"><div class="g4" style="margin-bottom:13px">';

  h+='<div class="stat-box"><div class="stat-box-lbl">Monthly Spend</div><div class="stat-box-val red">'+fmt(t.me,cur)+'</div></div>';
  h+='<div class="stat-box"><div class="stat-box-lbl">Savings Rate</div><div class="stat-box-val '+(sv>20?'green':'red')+'">'+sv.toFixed(0)+'%</div></div>';
  h+='</div>';
  h+='<div class="card" style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;margin-bottom:11px">6-Month Spending Trend</div>';
  h+='<div class="cwrap"><canvas id="trend-chart"></canvas></div></div>';
  h+='<div class="card" style="margin-bottom:12px"><div style="font-size:13px;font-weight:700;margin-bottom:11px">Spending by Category</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;align-items:center">';
  h+='<div class="cwrap" style="height:140px"><canvas id="spend-chart2"></canvas></div>';
  h+='<div id="spend-legend2"></div></div></div>';

  // ── Necessity Analysis ──
  var necTotals={need:0,want:0,avoid:0};
  var avoidList=[];
  d.expenses.forEach(function(e){
    var a=toBase(+e.amount||0,e.currency);
    var mo=e.type==='daily'?a*30:e.type==='weekly'?a*4.33:e.type==='once'?0:a;
    var nec=e.necessity||'need';
    necTotals[nec]=(necTotals[nec]||0)+mo;
    if(nec==='avoid')avoidList.push({name:e.name,mo:mo,cur:cur});
  });
  var necTotal=necTotals.need+necTotals.want+necTotals.avoid||1;
  h+='<div class="card"><div style="font-size:13px;font-weight:700;margin-bottom:14px">💡 Spending Analysis</div>';
  // Three bars
  [{k:'need',emoji:'✅',label:'Necessities'},{k:'want',emoji:'⚠️',label:'Wants'},{k:'avoid',emoji:'🚫',label:'Avoidable'}].forEach(function(row){
    var amt=necTotals[row.k]||0,pct=Math.round(amt/necTotal*100);
    var cfg=NEC_CFG[row.k];
    h+='<div style="margin-bottom:12px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">';
    h+='<div style="display:flex;align-items:center;gap:6px"><span>'+row.emoji+'</span><span style="font-size:12px;font-weight:600">'+row.label+'</span></div>';
    h+='<div style="display:flex;gap:10px;align-items:center"><span class="mono" style="font-size:12px;font-weight:700">'+fmt(amt,cur)+'</span><span style="font-size:11px;color:var(--t2);min-width:32px;text-align:right">'+pct+'%</span></div>';
    h+='</div>';
    h+='<div class="pbar"><div class="pfill" style="width:'+pct+'%;background:'+cfg.color+'"></div></div>';
    h+='</div>';
  });
  // Savings opportunity
  if(necTotals.avoid>0){
    h+='<div style="background:var(--rdd);border-radius:var(--r12);padding:11px 13px;margin-top:4px;margin-bottom:14px">';
    h+='<div style="font-size:12px;font-weight:700;color:var(--rd);margin-bottom:3px">🚫 You could save '+fmt(necTotals.avoid,cur)+'/month</div>';
    h+='<div style="font-size:11px;color:var(--rd);opacity:.8">by cutting these avoidable expenses:</div>';
    h+='</div>';
    h+='<div>';
    avoidList.forEach(function(e){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bds)">';
      h+='<span style="font-size:12px;color:var(--tx)">'+esc(e.name)+'</span>';
      h+='<span class="mono" style="font-size:12px;font-weight:700;color:var(--rd)">'+fmt(e.mo,cur)+'/mo</span>';
      h+='</div>';
    });
    h+='</div>';
  }else{
    h+='<div style="font-size:11px;color:var(--t3);margin-top:6px">Tag expenses as "Avoidable" when adding them to see savings opportunities here.</div>';
  }
  h+='</div>';

  h+='</div></div>';
  return h;
}

// ── MODALS ─────────────────────────────────────────────────────
function openModal(html){
  closeBsheet(); // close bottom sheet if open
  var el=document.getElementById('modal');
  el.innerHTML='<div class="overlay" id="modal-overlay" role="dialog" aria-modal="true"><div class="modal-box">'+html+'</div></div>';
  el.style.display='block';
  document.getElementById('modal-overlay').addEventListener('click',function(e){
    if(e.target===this)closeModal();
  });
}
function closeModal(){
  var el=document.getElementById('modal');
  el.style.display='none';
  el.innerHTML='';
}

// ── CHARTS ─────────────────────────────────────────────────────
var CHARTS={};
function killCharts(){Object.keys(CHARTS).forEach(function(k){try{CHARTS[k].destroy();}catch(e){}});CHARTS={};}

function initSpendChart(canvasId,legendId){
  var canvas=document.getElementById(canvasId);if(!canvas)return;
  var cats={};
  app.data.expenses.forEach(function(e){
    var v=toBase(+e.amount||0,e.currency);
    var m=e.type==='daily'?v*30:e.type==='weekly'?v*4.33:e.type==='once'?0:v;
    cats[e.cat||'Other']=(cats[e.cat||'Other']||0)+m;
  });
  var lbs=Object.keys(cats),vs=lbs.map(function(k){return cats[k];});
  // Use catColor() for each category so custom categories get their color
  var clrs=lbs.map(function(k){return catColor(k);});
  CHARTS[canvasId]=new Chart(canvas,{type:'doughnut',data:{labels:lbs,datasets:[{data:vs,backgroundColor:clrs,borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  var leg=document.getElementById(legendId);
  if(leg){var cur=app.data.settings.currency||'AED';leg.innerHTML=lbs.map(function(k,i){return '<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px"><div style="width:7px;height:7px;border-radius:2px;background:'+clrs[i]+';flex-shrink:0"></div><span style="font-size:11px;color:var(--t2);flex:1">'+esc(k)+'</span><span class="mono" style="font-size:10px">'+fmt(vs[i]||0,cur)+'</span></div>';}).join('');}
}

function initTrendChart(){
  var canvas=document.getElementById('trend-chart');if(!canvas)return;
  var t=totals(),cur=app.data.settings.currency||'AED';
  var ms=[],vs=[],sf=[0.88,0.92,0.97,1.05,1.08,1.0];
  for(var i=5;i>=0;i--){var dd=new Date();dd.setMonth(dd.getMonth()-i);ms.push(MN[dd.getMonth()]);vs.push(Math.round(t.me*sf[5-i]));}
  var acColor=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#10D9A8';
  CHARTS['trend-chart']=new Chart(canvas,{type:'bar',data:{labels:ms,datasets:[{data:vs,backgroundColor:acColor+'33',borderColor:acColor,borderWidth:1.5,borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(128,128,128,.07)'},ticks:{color:'#8B8FA8',font:{size:10}}},y:{grid:{color:'rgba(128,128,128,.07)'},ticks:{color:'#8B8FA8',font:{size:10},callback:function(v){return cur+' '+(v>=1000?(v/1000).toFixed(0)+'K':v);}}}}}});
}

function initCharts(){
  if(app.view==='dashboard')initSpendChart('spend-chart','spend-legend');
  if(app.view==='reports'){initTrendChart();initSpendChart('spend-chart2','spend-legend2');}
}

// Auth mode: 'signin' | 'signup'
var _authMode = 'signin';

function switchMode(){
  _authMode = _authMode==='signin' ? 'signup' : 'signin';
  var isSignin = _authMode==='signin';
  document.getElementById('auth-heading').textContent = isSignin ? 'Welcome back' : 'Create account';
  document.getElementById('auth-switch-text').textContent = isSignin ? "Don't have an account?" : 'Already have an account?';
  document.getElementById('auth-switch-btn').textContent = isSignin ? 'Sign Up' : 'Sign In';
  document.getElementById('auth-submit-btn').textContent = isSignin ? 'Sign In' : 'Create Account';
  document.getElementById('field-name').style.display = isSignin ? 'none' : 'block';
  document.getElementById('auth-error').style.display = 'none';
  // Clear fields
  document.getElementById('auth-email').value='';
  document.getElementById('auth-password').value='';
  if(!isSignin)document.getElementById('signup-name').value='';
}

function setAuthError(msg){
  var el=document.getElementById('auth-error');
  el.textContent=msg;el.style.display='block';
}

function handleAuthSubmit(){
  var email=document.getElementById('auth-email').value.trim();
  var pass=document.getElementById('auth-password').value;
  if(!email||!pass){setAuthError('Please enter your email and password.');return;}
  document.getElementById('auth-error').style.display='none';
  document.getElementById('auth-submit-btn').textContent='Please wait...';
  document.getElementById('auth-submit-btn').disabled=true;

  var reset=function(){
    document.getElementById('auth-submit-btn').disabled=false;
    document.getElementById('auth-submit-btn').textContent=_authMode==='signin'?'Sign In':'Create Account';
  };

  if(_authMode==='signin'){
    firebase.auth().signInWithEmailAndPassword(email,pass)
      .catch(function(err){reset();setAuthError(err.message);});
  }else{
    var name=document.getElementById('signup-name').value.trim();
    if(!name){reset();setAuthError('Please enter your full name.');return;}
    if(pass.length<6){reset();setAuthError('Password must be at least 6 characters.');return;}
    firebase.auth().createUserWithEmailAndPassword(email,pass)
      .then(function(cred){
        return cred.user.updateProfile({displayName:name})
          .then(function(){return cred.user.reload();})
          .catch(function(){});
      })
      .catch(function(err){reset();setAuthError(err.message);});
  }
}

  document.getElementById('auth-error').style.display='none';
  var btn=document.getElementById('google-signin-btn');
  if(btn){btn.disabled=true;btn.textContent='Signing in...';}
  var provider=new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(function(err){
    var errEl=document.getElementById('auth-error');
    errEl.textContent=err.message;
    errEl.style.display='block';
    var signinBtn=document.getElementById('google-signin-btn');
    if(signinBtn){signinBtn.disabled=false;signinBtn.innerHTML='<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.6 32.8 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.3 6.5 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16.1 18.9 13 24 13c3.1 0 5.8 1.1 7.9 2.9l5.7-5.7C34.3 6.5 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-1.9 13.6-5.1l-6.3-5.3C29.5 35.2 26.9 36 24 36c-5.2 0-9.5-3.1-11.3-7.6L6 33.6C9.3 39.7 16.1 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.7l6.3 5.3C36.9 40.2 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg> Sign in with Google';}
  });
}

function signOut(){
  firebase.auth().signOut().then(function(){
    document.getElementById('app-root').style.display='none';
    document.getElementById('auth-screen').style.display='flex';document.body.classList.add('auth-open');document.documentElement.classList.add('auth-open');
  });
}

(function(){
  // ── FIREBASE INIT ──
  try{ firebase.initializeApp(firebaseConfig); }catch(e){}

  // sign-out from data-action buttons inside rendered HTML
  document.addEventListener('click',function(e){
    if(e.target.closest('[data-action="sign-out"]')){
      if(confirm('Sign out of Wealthr?'))signOut();
    }
  });

  // Show loading while Firebase checks existing session
  var _loadingEl=document.getElementById('auth-loading');
  if(_loadingEl)_loadingEl.style.display='block';

  firebase.auth().onAuthStateChanged(function(user){
    if(_loadingEl)_loadingEl.style.display='none';
    if(user){
      // expose _userId to the app IIFE via window
      window._wealthrUserId=user.uid;
      // trigger loadData via the exposed function
      window._wealthrLoadData(function(data){
        window._wealthrApp.data=data;
        document.getElementById('auth-screen').style.display='none';document.body.classList.remove('auth-open');document.documentElement.classList.remove('auth-open');
        document.getElementById('app-root').style.display='block';
        window._wealthrRender();
      });
    }else{
      window._wealthrUserId=null;
      document.getElementById('app-root').style.display='none';
      document.getElementById('auth-screen').style.display='flex';document.body.classList.add('auth-open');document.documentElement.classList.add('auth-open');
    }
  });
})();
</script>
